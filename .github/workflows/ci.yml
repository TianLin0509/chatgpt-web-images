name: Windows contracts
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - name: Installed wheel imports outside the source tree
        working-directory: ${{ runner.temp }}
        run: python -c "import web_images, web_images_setup, image_service, image_worker, image_pool, human_gate, chatgpt_interaction, codex_imagegen, codex_lane; print(web_images.VERSION)"
      - run: python scripts/test_web_images.py
      - run: python scripts/test_mcp_protocol.py
      - run: python scripts/test_image_pool.py
      - run: python scripts/test_pool_protocol.py
      - run: python scripts/test_account_contracts.py
      - run: python scripts/test_reliability.py
      - run: python scripts/test_throughput.py
      - run: python scripts/test_recovery_runtime.py
      - run: python scripts/test_poll_pressure.py
      - run: python scripts/test_human_gate.py
      - run: python scripts/test_codex_fallback.py
      - run: python scripts/test_image_pool.py
      - run: python scripts/test_pool_protocol.py
      - run: python scripts/test_account_contracts.py
      - run: python scripts/check_release.py
      - run: python -m pip wheel --no-deps . -w dist
